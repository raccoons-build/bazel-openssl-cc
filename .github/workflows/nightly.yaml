# Build upstream OpenSSL master with the current overlay, every night.
#
# Pull requests cover the released versions in .github/openssl-versions.json;
# this looks forward instead: it resolves the current openssl/openssl master
# commit and runs the Release workflow against it in dry-run mode. A red
# nightly means the next OpenSSL release will need overlay changes.
name: Nightly upstream master
"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: null
jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve openssl/openssl master
        id: resolve
        # git ls-remote rather than the GitHub API: anonymous API calls share
        # a per-IP rate limit across hosted runners and get 403s.
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/openssl/openssl.git refs/heads/master | cut -f1)
          test -n "$sha"
          version=$(curl -fsSL "https://raw.githubusercontent.com/openssl/openssl/${sha}/VERSION.dat" \
            | awk -F= '/^MAJOR=/{a=$2} /^MINOR=/{b=$2} /^PATCH=/{c=$2} END{print a"."b"."c}')
          echo "openssl master is ${sha} (${version})"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  rehearse-release:
    name: openssl master (${{ needs.upstream.outputs.version }} @ ${{ needs.upstream.outputs.sha }})
    needs: upstream
    uses: ./.github/workflows/release.yaml
    with:
      release: ${{ needs.upstream.outputs.version }}.bcr.nightly
      openssl_ref: ${{ needs.upstream.outputs.sha }}
      dry_run: true
