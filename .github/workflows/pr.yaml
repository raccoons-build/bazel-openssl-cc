name: Pull Request
"on":
  workflow_dispatch: null
  pull_request: null
jobs:
  versions:
    # The released OpenSSL versions the overlay is expected to support. Add a
    # version to .github/openssl-versions.json to start verifying it; see
    # versions/README.md if it needs overlay changes. (Upstream master is
    # covered separately by nightly.yaml.)
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: read
        run: echo "list=$(jq -c . .github/openssl-versions.json)" >> "$GITHUB_OUTPUT"

  generate-and-test:
    name: openssl ${{ matrix.openssl_version }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        openssl_version: ${{ fromJSON(needs.versions.outputs.list) }}
    uses: ./.github/workflows/generate.yaml
    with:
      bcr_tag: ${{ matrix.openssl_version }}.bcr.wip

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1

  # Single required check for branch protection: succeeds only if every job
  # above succeeded (skipped or cancelled jobs count as failures).
  ci:
    name: CI
    if: always()
    needs:
      - versions
      - generate-and-test
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success")' > /dev/null
