name: Pull Request
"on":
  workflow_dispatch: null
  pull_request: null
jobs:
  generate-and-test:
    name: openssl ${{ matrix.openssl_version }}
    strategy:
      fail-fast: false
      matrix:
        # Every OpenSSL version the overlay is expected to support. Add a
        # version here to start verifying it; see versions/README.md if it
        # needs version-specific overlay changes.
        openssl_version:
          - "4.0.1"
          - "3.5.5"
    uses: ./.github/workflows/generate.yaml
    with:
      bcr_tag: ${{ matrix.openssl_version }}.bcr.wip

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
